<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zapatazo - Producción TV</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">CARPETA MADRE</div>
      <h1>Zapatazo</h1>
      <p>Gestión simple de programas, promos, redes y emisiones.</p>
    </div>
    <button id="btnNuevo" class="primary">+ Nuevo programa</button>
  </header>

  <main class="container">
    <section class="stats" id="stats"></section>

    <section class="tabs">
      <button class="tab active" data-tab="programas">Programas</button>
      <button class="tab" data-tab="calendario">Calendario</button>
    </section>

    <section id="programas" class="tab-panel active">
      <div class="toolbar">
        <input id="buscar" type="search" placeholder="Buscar programa..." />
        <select id="filtroEstado">
          <option value="todos">Todos</option>
          <option value="pendientes">Con pendientes</option>
          <option value="completos">Completos</option>
        </select>
      </div>
      <div id="listaProgramas" class="program-list"></div>
    </section>

    <section id="calendario" class="tab-panel">
      <div class="calendar-head">
        <button id="prevMes">←</button>
        <h2 id="mesTitulo"></h2>
        <button id="nextMes">→</button>
      </div>
      <div class="calendar-grid calendar-days">
        <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>
  </main>

  <dialog id="modalPrograma">
    <form method="dialog" id="formPrograma">
      <div class="modal-head">
        <h2 id="modalTitle">Nuevo programa</h2>
        <button type="button" id="cerrarModal" class="icon-btn">✕</button>
      </div>

      <input type="hidden" id="programaId" />

      <div class="form-grid">
        <label>
          Nombre / edición
          <input id="nombre" required placeholder="Ej: Zapatazo #24" />
        </label>
        <label>
          Fecha de emisión
          <input id="fecha" type="date" required />
        </label>
        <label>
          Hora
          <input id="hora" type="time" />
        </label>
        <label>
          Canal / plataforma
          <input id="canal" placeholder="Ej: Canal Z - YouTube" />
        </label>
      </div>

      <h3>Programa principal</h3>
      <div class="checks">
        <label><input type="checkbox" id="programa_editado" /> Editado</label>
        <label><input type="checkbox" id="programa_miniatura" /> Miniatura</label>
        <label><input type="checkbox" id="programa_publicado" /> Publicado</label>
      </div>

      <h3>Promo</h3>
      <div class="checks">
        <label><input type="checkbox" id="promo_hecho" /> Promo hecho</label>
        <label><input type="checkbox" id="promo_miniatura" /> Miniatura</label>
        <label><input type="checkbox" id="promo_publicado" /> Publicado</label>
      </div>

      <h3>Recortes para redes</h3>
      <div class="checks">
        <label><input type="checkbox" id="redes_recortes" /> Recortes hechos</label>
        <label><input type="checkbox" id="redes_miniaturas" /> Miniaturas hechas</label>
        <label><input type="checkbox" id="redes_instagram" /> Subidos a Instagram</label>
        <label><input type="checkbox" id="redes_youtube" /> Subidos a YouTube</label>
      </div>

      <label class="full">
        Observaciones
        <textarea id="observaciones" rows="4" placeholder="Comentarios, pendientes, datos importantes..."></textarea>
      </label>

      <div class="modal-actions">
        <button type="button" id="eliminar" class="danger hidden">Eliminar</button>
        <div class="spacer"></div>
        <button type="button" id="cancelar">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
